# --- Sensible base defaults ---
set -g mouse on
set -g history-limit 200000
set -g focus-events on
set -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#S:#I.#P - #W"
setw -g automatic-rename on
set -g default-terminal "tmux-256color"
set-option -g status-position top

# Tell tmux about common terminals that support 256 colors
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",screen-256color:Tc"
set -ga terminal-overrides ",tmux-256color:Tc"

# (Optional) Improve color handling in copy-mode/status with some terminals
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",screen-256color:RGB"
set -as terminal-features ",tmux-256color:RGB"

# Make status a bit more "workspace-like"
set -g status-interval 2
set -g status-left  "#S "
set -g status-right "#(date '+%Y-%m-%d %H:%M') "

# Keep tmux prefix for emergencies, but you won't need it much.
set -g prefix C-b
unbind C-b
bind C-b send-prefix
bind-key b send-prefix

# --- Zellij-like "locked <-> command" toggle ---
# In "locked" (root table), we bind ONLY Ctrl-g to enter our normal/command table.
# Everything else passes through to the application.
bind-key -T root C-g switch-client -T zj-normal

# In our normal/command table, Ctrl-g goes back to locked.
bind-key -T zj-normal C-g switch-client -T root

# If you need to send a literal Ctrl-g to the app:
# Ctrl-g (enter command) then g (send Ctrl-g) then return to locked
bind-key -T zj-normal g send-keys C-g \; switch-client -T root

# --- Shared “quick” bindings available in all zj-* tables (except locked) ---
# (Zellij has a bunch of Alt-* bindings active outside locked; we approximate that.)
bind-key -T root M-h select-pane -L
bind-key -T root M-j select-pane -D
bind-key -T root M-k select-pane -U
bind-key -T root M-l select-pane -R
bind-key -T zj-normal M-h select-pane -L
bind-key -T zj-normal M-j select-pane -D
bind-key -T zj-normal M-k select-pane -U
bind-key -T zj-normal M-l select-pane -R
bind-key -T zj-pane   M-h select-pane -L
bind-key -T zj-pane   M-j select-pane -D
bind-key -T zj-pane   M-k select-pane -U
bind-key -T zj-pane   M-l select-pane -R
bind-key -T zj-tab    M-h select-pane -L
bind-key -T zj-tab    M-j select-pane -D
bind-key -T zj-tab    M-k select-pane -U
bind-key -T zj-tab    M-l select-pane -R
bind-key -T zj-resize M-h select-pane -L
bind-key -T zj-resize M-j select-pane -D
bind-key -T zj-resize M-k select-pane -U
bind-key -T zj-resize M-l select-pane -R

# Quick create pane + fullscreen, Zellij-ish
bind-key -T zj-normal M-n split-window -h -c "#{pane_current_path}"
bind-key -T root M-n split-window -h -c "#{pane_current_path}"
bind-key -T root M-N split-window -v -c "#{pane_current_path}"
bind-key -T zj-normal M-f resize-pane -Z

# --- From “normal”, jump to sub-modes (like Zellij) ---
# Zellij defaults use Ctrl-p (pane), Ctrl-t (tab), Ctrl-n (resize), Ctrl-s (scroll). :contentReference[oaicite:1]{index=1}
bind-key -T root C-p switch-client -T zj-pane
bind-key -T zj-normal C-t switch-client -T zj-tab
bind-key -T zj-normal C-n switch-client -T zj-resize
bind-key -T zj-normal C-s copy-mode
bind-key -T root C-t switch-client -T zj-tab

# --- Pane mode (like Zellij Pane mode) ---
# Exit back to normal with Enter/Esc/Ctrl-p (Zellij uses Ctrl-p to leave Pane mode). :contentReference[oaicite:2]{index=2}
bind-key -T zj-pane Enter switch-client -T zj-normal
bind-key -T zj-pane Escape switch-client -T zj-normal
bind-key -T zj-pane C-p switch-client -T zj-normal

# Move focus (hjkl)
bind-key -T zj-pane h swap-pane -L
bind-key -T zj-pane j swap-pane -D
bind-key -T zj-pane k swap-pane -U
bind-key -T zj-pane l swap-pane -R

# Split like Zellij defaults: d=down, r=right, n=new (we map n to right split)
bind-key -T zj-pane d split-window -v -c "#{pane_current_path}"
bind-key -T zj-pane r split-window -h -c "#{pane_current_path}"
bind-key -T zj-pane n split-window -h -c "#{pane_current_path}"

# Close / fullscreen
bind-key -T zj-pane x kill-pane
bind-key -T zj-pane f resize-pane -Z

# Optional: “floating-ish” scratch pane using tmux popup (tmux 3.2+)
# Press w to open a popup shell in current path.
bind-key -T zj-pane w display-popup -E -w 90% -h 90% -d "#{pane_current_path}"

# Rename current pane (Zellij has a rename pane input; tmux is simpler)
bind-key -T zj-pane c command-prompt -I "#{pane_title}" "select-pane -T '%%'"

# --- Tab mode (tmux windows ~= Zellij tabs) ---
bind-key -T zj-tab Enter switch-client -T zj-normal
bind-key -T zj-tab Escape switch-client -T zj-normal
bind-key -T zj-tab C-t switch-client -T zj-normal

# Next/prev tab on hjkl (Zellij does this in Tab mode). :contentReference[oaicite:3]{index=3}
bind-key -T zj-tab h previous-window
bind-key -T zj-tab l next-window
bind-key -T zj-tab j next-window
bind-key -T zj-tab k previous-window

# New/close tab
bind-key -T zj-tab n new-window -c "#{pane_current_path}"
bind-key -T zj-tab x kill-window

# Toggle last tab
bind-key -T zj-tab Tab last-window

# Go to tab 1-9
bind-key -T zj-tab 1 select-window -t 1
bind-key -T zj-tab 2 select-window -t 2
bind-key -T zj-tab 3 select-window -t 3
bind-key -T zj-tab 4 select-window -t 4
bind-key -T zj-tab 5 select-window -t 5
bind-key -T zj-tab 6 select-window -t 6
bind-key -T zj-tab 7 select-window -t 7
bind-key -T zj-tab 8 select-window -t 8
bind-key -T zj-tab 9 select-window -t 9

# Rename tab (window)
bind-key -T zj-tab r command-prompt -I "#{window_name}" "rename-window '%%'"

# --- Resize mode ---
bind-key -T zj-resize Enter switch-client -T zj-normal
bind-key -T zj-resize Escape switch-client -T zj-normal
bind-key -T zj-resize C-n switch-client -T zj-normal

# Resize (hjkl), bigger steps on uppercase (like Zellij). :contentReference[oaicite:4]{index=4}
bind-key -T zj-resize h resize-pane -L 2
bind-key -T zj-resize j resize-pane -D 1
bind-key -T zj-resize k resize-pane -U 1
bind-key -T zj-resize l resize-pane -R 2
bind-key -T zj-resize H resize-pane -L 8
bind-key -T zj-resize J resize-pane -D 4
bind-key -T zj-resize K resize-pane -U 4
bind-key -T zj-resize L resize-pane -R 8
bind-key -T zj-resize = resize-pane -Z   # quick “zoom” toggle
bind-key -T zj-resize - resize-pane -Z

# --- Quality-of-life: keep splits consistent ---
setw -g aggressive-resize on
set -g detach-on-destroy off

